# TNHoppers - Tài Nguyễn
# Core defaults. GUI/filter persistence is available; paid upgrades and entity suction are active.
storage:
  sqlite-file: "tnhoppers.db"
  busy-timeout-ms: 5000
  journal-mode: "WAL"
  synchronous: "NORMAL"

hoppers:
  # Khi người chơi đặt phễu vanilla, tự động kích hoạt thành TNHopper
  auto-convert-placed-hoppers: true

wireless:
  enabled: true
  default-max-links: 1
  default-max-distance: 15
  # Session Link Wand tự hết hạn sau 60 giây; max-links/distance áp dụng ở Link Wand.
  # Allowed modes: INSERT_BY_ORDER, DISTRIBUTE_EQUALLY
  default-mode: "INSERT_BY_ORDER"

transfer:
  # Base transfer tick loop check interval
  check-interval-ticks: 2
  # Default intervals and amounts (can be boosted by upgrades)
  interval-ticks: 20
  max-items-per-cycle: 1

suction:
  # Bật tính năng hút vật phẩm rơi tự do (Suction Engine)
  enabled: true
  # RADIUS: hút theo bán kính quanh phễu; CHUNK: hút toàn bộ chunk 16x16
  mode: "RADIUS"
  radius: 3.0
  # Quét trực tiếp liên tục (Live Scans: 2 ticks = 0.1s)
  interval-ticks: 2
  # Ngân sách xử lý tối đa mỗi chu kỳ
  max-hoppers-per-cycle: 256
  max-entities-per-cycle: 256
  max-entities-per-hopper-per-cycle: 64
  max-items-per-cycle: 256
  # Bỏ qua item dành riêng cho người khác (đặt false để gom tất cả đồ farm/rơi tự do)
  respect-item-owner: false
  # Phát sự kiện InventoryPickupItemEvent (false để tránh bị plugin khác chặn nhầm khi hút xa)
  call-pickup-event: false

upgrades:
  # Enable paid upgrades via Vault economy (falls back to XP levels if Vault is absent)
  purchases-enabled: true
  costs:
    speed-base: 1000.0
    amount-base: 2500.0
    links-base: 1500.0
    distance-base: 2000.0

integrations:
  superior-skyblock2:
    enabled: true
    # Yêu cầu phễu phải được đặt bên trong đảo (không cho đặt vùng hoang dã)
    require-island-to-place: true
    # Ngăn chặn liên kết rương xuyên qua đảo của người chơi khác
    allow-cross-island-linking: false
    # Định kỳ xác minh chủ phễu còn quyền trên đảo đích trong lúc chuyển đồ
    validate-island-membership-on-transfer: true
  vault:
    enabled: true

logging:
  debug: false
